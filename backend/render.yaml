# Render Blueprint Configuration for ManagePetro Backend
# This file automates deployment to Render.com
#
# IMPORTANT: This file is located in the backend/ folder because 
# the Render service root directory is set to /backend
# The frontend must be deployed separately as a Static Site in Render dashboard

services:
  # Backend API Service
  - type: web
    name: managepetro-backend
    runtime: python
    region: oregon
    plan: free
    # No rootDir needed - render.yaml is already in backend/ folder
    buildCommand: pip install -r requirements.txt && python init_production_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        fromDatabase:
          name: managepetro-db
          property: connectionString
      # Add your API keys in the Render dashboard - DO NOT commit real keys to git!
      - key: WEATHER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: TOMTOM_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will auto-generate a secure secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DEFAULT_LLM_MODEL
        value: models/gemini-2.0-flash-exp
      - key: FRONTEND_URL
        sync: false  # Set this to your frontend URL after deploying frontend
      
  # Frontend Static Site  
  # Note: Frontend is NOT included in this blueprint (only backend/ is deployed)
  # Deploy frontend separately as a Static Site in Render dashboard
  # Use these settings when creating the frontend static site:
  #   - Root Directory: frontend
  #   - Build Command: npm install && npm run build
  #   - Publish Directory: dist
  #   - Add rewrite rule: /* -> /index.html (for SPA routing)
  #   - Set VITE_API_BASE_URL environment variable to your backend URL

# Database
databases:
  - name: managepetro-db
    databaseName: manage_petro_db
    user: managepetro_user
    region: oregon
    plan: free
    ipAllowList: []  # Empty means allow all IPs

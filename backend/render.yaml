# Render Blueprint Configuration for ManagePetro Backend
# This file automates deployment to Render.com
#
# IMPORTANT: Set Root Directory to "backend" when creating service in Render dashboard
# Database: External Supabase PostgreSQL (set DATABASE_URL in Render dashboard)

services:
  # Backend API Service
  - type: web
    name: managepetro-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_production_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      # Set DATABASE_URL to your Supabase connection string in Render dashboard
      # Get it from: Supabase Dashboard > Project Settings > Database > Connection String
      # Use Session Mode pooler for persistent servers: postgresql://...@aws-0-[region].pooler.supabase.com:5432/postgres
      # Or Direct connection if your Render region supports IPv6: postgresql://...@db.[project-ref].supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard with your Supabase connection string
      # Add your API keys in the Render dashboard - DO NOT commit real keys to git!
      - key: WEATHER_API_KEY
        sync: false  # Set this in Render dashboard
      - key: TOMTOM_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will auto-generate a secure secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: DEFAULT_LLM_MODEL
        value: models/gemini-2.0-flash-exp
      - key: FRONTEND_URL
        sync: false  # Set this to your frontend URL after deploying frontend
      
  # Frontend Static Site  
  # Note: Frontend is NOT included in this blueprint (only backend/ is deployed)
  # Deploy frontend separately as a Static Site in Render dashboard
  # Use these settings when creating the frontend static site:
  #   - Root Directory: frontend
  #   - Build Command: npm install && npm run build
  #   - Publish Directory: dist
  #   - Add rewrite rule: /* -> /index.html (for SPA routing)
  #   - Set VITE_API_BASE_URL environment variable to your backend URL

# Database: Using external Supabase PostgreSQL
# No database section needed - configure DATABASE_URL environment variable above
